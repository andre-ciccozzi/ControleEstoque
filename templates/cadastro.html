<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="https://unpkg.com/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="icon" href="/img/logo.png" type="image/png">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/inscreva-se.css') }}">
    <link rel="stylesheet" href="https://unpkg.com/bs-brain@2.0.4/components/logins/login-9/assets/css/login-9.css">
    <link rel="stylesheet" href="/static/cadastro.css">
</head>

<body>
    <section class="py-3 py-md-5 py-xl-8">
        <div class="container">
            <div class="row gy-4 align-items-center">
                <div class="col-12 col-md-6 col-xl-7">
                    <div class="d-flex justify-content-center">
                        <div class="col-12 col-xl-10 info-section">
                            <!-- Conteúdo da seção de informação -->
                        </div>
                    </div>
                </div>
                <div class="col-12 col-md-6 col-xl-5 d-flex justify-content-center">
                    <div class="card border-0 rounded-4 w-100">
                        <div class="card-body p-md-4">
                            <div class="row">
                                <div class="col-12 mb-3">
                                    <a class="btn btn-outline-primary btn-md btn-custom ml-custom" role="button"
                                        href="login.html">Voltar</a>
                                </div>
                                <div class="col-12 text-center mb-4">
                                    <a href="{{ url_for('home') }}"><img class="img-fluid"
                                            src="/img/logo.png" alt="Logo" style="width: 30%;"></a>
                                    <h3>Cadastro</h3>
                                    <p>Já tem uma conta? <a href="login.html">Login</a></p>
                                </div>
                            </div>
                            <form id="userForm">
                                <div class="col-12 mb-3">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="user" name="user" placeholder="Usuário" required>
                                        <label for="user">Usuário <span class="text-danger">*</span></label>
                                    </div>
                                </div>
                                <div class="col-12 mb-3">
                                    <div class="form-floating">
                                        <input type="email" class="form-control" id="email" name="email" placeholder="email@exemplo.com" required>
                                        <label for="email">Email <span class="text-danger">*</span></label>
                                    </div>
                                </div>
                                <div class="col-12 mb-3">
                                    <div class="form-floating">
                                        <input type="password" class="form-control" id="password" name="password" placeholder="Senha" required>
                                        <label for="password">Senha <span class="text-danger">*</span></label>
                                    </div>
                                </div>
                                <div class="col-12 mt-2 mb-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="" name="remember_me" id="remember_me">
                                        <label class="form-check-label text-secondary" for="remember_me">
                                            Mostrar a Senha
                                        </label>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="d-grid">
                                        <button class="btn btn-primary btn-lg" type="submit">Confirmar</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://unpkg.com/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
</body>

</html>
