<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizar e Gerenciar Estoque - Equipamentos sem Patrimônio</title>
    <link rel="icon" href="{{ url_for('static', filename='img/logo.png') }}" type="image/png">
    <link rel="stylesheet" href="{{ url_for('static', filename='estoque.css') }}">
</head>
<body>
    <header>
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" class="logo">
        <h1 class="title">Equipamentos sem Patrimônio</h1>
    </header>
    <div class="container">
        <h2>Lista de Equipamentos sem Patrimônio</h2>
        
        <div class="table-container">
            <table id="inventory-table">
                <thead>
                    <tr>
                        <th>Descrição Comercial</th>
                        <th>Unidade</th>
                        <th>Marca/Modelo</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody>
                    {% for produto in produtos_sem_patrimonio %}
                    <tr>
                        <td>{{ produto.DescricaoComercial }}</td>
                        <td>{{ produto.Unidade }}</td>
                        <td>{{ produto.MarcaModelo }}</td>
                        <td>{{ produto.Total }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
    <footer>
        <p>&copy; AGS Solution</p>
    </footer>
    
    <script src="{{ url_for('static', filename='estoque.js') }}"></script>
</body>
</html>
