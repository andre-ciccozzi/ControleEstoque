<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Controle de Estoque</title>
    <link rel="icon" href="{{ url_for('static', filename='img/logo.png') }}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='cadastro.css') }}">
</head>

<body>
    <nav class="topbar">
        <div class="topbar-inner">
            <div class="brand">Controle de Estoque</div>
            <div class="nav-links">
                <a href="{{ url_for('login') }}">Login</a>
                <a href="{{ url_for('cadastro') }}">Cadastro</a>
            </div>
        </div>
    </nav>

    <main class="auth-page">
        <div class="auth-card">
            <div class="brand-wrap">
                <a href="{{ url_for('cadastro') }}">
                    <img class="logo" src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo">
                </a>
                <h2>Crie sua conta</h2>
                <p>
                    Já tem uma conta?
                    <a href="{{ url_for('login') }}">Faça login</a>
                </p>
            </div>

            <form class="auth-form" id="userForm" action="{{ url_for('cadastro') }}" method="POST">
                <div class="field-group">
                    <label for="user">Usuário</label>
                    <input id="user" name="name" type="text" autocomplete="user" required placeholder="Usuário">
                </div>

                <div class="field-group">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" autocomplete="email" required placeholder="Email">
                </div>

                <div class="field-group">
                    <label for="password">Senha</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Senha">
                </div>

                <button type="submit" class="primary-btn">Confirmar</button>
            </form>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="alert-box" role="alert">
                        <ul>
                            {% for message in messages %}
                                <li>{{ message }}</li>
                            {% endfor %}
                        </ul>
                    </div>
                {% endif %}
            {% endwith %}
        </div>
    </main>
</body>

</html>
