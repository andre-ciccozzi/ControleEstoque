<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
</head>
<body>
    <header>
        <img src="imagens/logo.png" alt="Logo" class="logo">
        <h1 class="title">EstoqueSimples</h1>
    </header>
    <div class="container">
        <form id="add-item-form">
            <h2>Adicionar Item</h2>
            <label for="item-name">Nome do Item:</label>
            <input type="text" id="item-name" name="item-name" required>
            
            <label for="item-quantity">Quantidade:</label>
            <input type="number" id="item-quantity" name="item-quantity" required>
            
            <label for="item-status">Status:</label>
            <select id="item-status" name="item-status" required>
                <option value="available">Disponível</option>
                <option value="assigned">Com Usuário</option>
                <option value="damaged">Danificado</option>
            </select>
            
            <button type="submit" class="btn-adicionar">Adicionar</button>
        </form>

        <table id="inventory-table">
            <thead>
                <tr>
                    <th>Nome do Item</th>
                    <th>Quantidade</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <!-- Linhas dinâmicas serão inseridas aqui -->
            </tbody>
        </table>
        
        <div id="message"></div>
    </div>
    <footer>
        <p>&copy; StoqueSimples</p>
    </footer>
    <button class="btn-estoque">Estoque</button>
</body>
</html>
